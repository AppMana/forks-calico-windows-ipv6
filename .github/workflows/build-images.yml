name: Build, test, and publish node image

on:
  push:
    branches:
      - appmana-v3.32.2
      - appmana-v3.32.2-rebase
      - cloud-provisioning/**
      - feature/labcontainers-native-sdk
    # A release is an immutable tag on the release line; its images carry the
    # tag name exactly, so the published bytes always map to one commit.
    tags:
      - v3.32.2-appmana.post.*
  pull_request:
    branches:
      - appmana-v3.32.2
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/appmana
  IMAGE_NAME: node
  IMAGE_TAG: v3.32.2-appmana.post.2
  RELEASE_BRANCH: appmana-v3.32.2

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image_tag }}
      linux-image: ${{ steps.meta.outputs.linux_image }}
      windows-image: ${{ steps.meta.outputs.windows_image }}
      manifest-image: ${{ steps.meta.outputs.manifest_image }}
      cni-linux-image: ${{ steps.meta.outputs.cni_linux_image }}
      cni-image: ${{ steps.meta.outputs.cni_image }}
      cni-windows-image: ${{ steps.meta.outputs.cni_windows_image }}
    steps:
      - name: Compute image names
        id: meta
        run: |
          image_tag="${IMAGE_TAG}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # The workflow's IMAGE_TAG is bumped in the tagged commit; a
            # mismatch means the tag points at a commit built for another
            # release and must not overwrite that release's images.
            if [[ "$GITHUB_REF_NAME" != "$IMAGE_TAG" ]]; then
              echo "tag $GITHUB_REF_NAME does not match IMAGE_TAG $IMAGE_TAG" >&2
              exit 1
            fi
          else
            # Every branch, including the release branch, needs revision-
            # specific platform tags. Otherwise overlapping runs can assemble
            # one manifest from Linux and Windows images of different commits.
            # Only an explicit release Git tag may publish the bare version.
            branch_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g' | cut -c1-65)"
            image_tag="${IMAGE_TAG}-${branch_tag}-${GITHUB_SHA:0:12}"
          fi
          manifest_image="${REGISTRY}/${IMAGE_NAME}:${image_tag}"
          linux_image="${REGISTRY}/${IMAGE_NAME}:${image_tag}-linux-amd64"
          windows_image="${REGISTRY}/${IMAGE_NAME}:${image_tag}-windows-ltsc2022"
          # The cni manifest list serves both CNI contracts: Linux install-cni
          # and the Windows install-cni init container, which runs
          # opt/cni/bin/install.exe (node-windows has the plugins but not the
          # installer). One pin then covers images.calico.cni and
          # images.calico.windows.cni.
          cni_linux_image="${REGISTRY}/cni:${image_tag}-linux-amd64"
          cni_image="${REGISTRY}/cni:${image_tag}"
          cni_windows_image="${REGISTRY}/cni:${image_tag}-windows-ltsc2022"
          {
            echo "image_tag=${image_tag}"
            echo "manifest_image=${manifest_image}"
            echo "linux_image=${linux_image}"
            echo "windows_image=${windows_image}"
            echo "cni_linux_image=${cni_linux_image}"
            echo "cni_image=${cni_image}"
            echo "cni_windows_image=${cni_windows_image}"
          } >> "$GITHUB_OUTPUT"
          echo "Manifest image: ${manifest_image}"
          echo "CNI image: ${cni_image}"

  test-linux-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - api
          - app-policy
          - apiserver
          - calicoctl
          - confd
          - cni-plugin
          - felix
          - goldmane
          - guardian
          - hack
          - key-cert-provisioner
          - kube-controllers
          - lib
          - libcalico-go
          - node
          - pod2daemon
          - release
          - typha
          - whisker-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Add upstream Calico remote
        run: |
          git remote add projectcalico https://github.com/projectcalico/calico.git
          git fetch --no-tags projectcalico release-v3.32

      - name: Linux unit tests
        run: |
          if [ "${{ matrix.component }}" = "kube-controllers" ]; then
            make -C kube-controllers image
          fi
          make -C "${{ matrix.component }}" ut

  test-native-lab-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hack/appmana/lab/go.mod
      - name: Install offline-media inspection tools
        run: sudo apt-get update && sudo apt-get install -y xorriso genisoimage
      - name: Test native SDK consumers and crash/recovery contracts
        working-directory: hack/appmana/lab
        run: go test -race ./... -count=1

  build-windows-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows-adapter/go.mod
          cache-dependency-path: windows-adapter/go.sum
      - name: Test standalone adapter without k0s or Labcontainers dependencies
        working-directory: windows-adapter
        run: |
          go test -race ./... -count=1
          if go list -deps ./cmd/calico-windows-adapter | grep -E 'github.com/(appmana/labcontainers|k0sproject/k0s)/'; then
            echo 'adapter must not depend on a distribution or lab runtime' >&2
            exit 1
          fi
      - name: Build redistributable binaries with source identity
        working-directory: windows-adapter
        run: |
          mkdir -p dist
          cp ../LICENSE.md dist/LICENSE.md
          for target in linux/amd64 linux/arm64 windows/amd64; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            suffix=""
            if [ "$target_os" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o "dist/calico-windows-adapter-${target_os}-${target_arch}${suffix}" ./cmd/calico-windows-adapter
          done
          cd dist
          sha256sum calico-windows-adapter-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: calico-windows-adapter-${{ github.sha }}
          path: windows-adapter/dist/
          if-no-files-found: error

  release-windows-adapter:
    if: github.ref_type == 'tag'
    needs: [build-windows-adapter, publish-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: calico-windows-adapter-${{ github.sha }}
          path: adapter
      - name: Attach adapter to the matching Calico release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" adapter/*

  test-linux-appmana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Add upstream Calico remote
        run: |
          git remote add projectcalico https://github.com/projectcalico/calico.git
          git fetch --no-tags projectcalico release-v3.32

      - name: AppMana targeted Go tests
        run: |
          go test ./libcalico-go/lib/winmtu ./felix/dataplane/windows/...
          go test ./confd/pkg/backends/calico/...
          go test ./cni-plugin/pkg/dataplane/windows/...
          go test ./cni-plugin/pkg/ipamplugin/...
          go test ./cni-plugin/pkg/plugin/...
          go test -run TestGetKubeconfigPath ./node/pkg/cni
          go test -run TestManageNodeConditionLifecycle ./node/pkg/lifecycle/startup/...

      - name: AppMana kind/QEMU script tests
        run: |
          bash -n hack/appmana/apply-kind-qemu-forwarding.sh \
            hack/appmana/run-kind-qemu-health.sh \
            hack/appmana/ipv6-health-check.sh \
            hack/appmana/tests/run-appmana-script-tests.sh
          hack/appmana/tests/run-appmana-script-tests.sh

      - name: PowerShell Pester tests
        shell: pwsh
        run: |
          # Pin Pester 5: the suites use Pester 5 semantics (multiple BeforeEach was
          # tolerated, mock behavior differs); runner-installed "latest" jumped to
          # 6.0.0 on 2026-07-07 and broke discovery. Migrate deliberately.
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = @(
              './confd/windows-packaging/tests/config-bgp.tests.ps1',
              './node/windows-packaging/tests/calico.tests.ps1'
          )
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @(
              './confd/windows-packaging/config-bgp.psm1',
              './node/windows-packaging/CalicoWindows/libs/calico/calico.psm1'
          )
          Invoke-Pester -Configuration $config

  test-windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          go vet ./cni-plugin/pkg/dataplane/windows/...
          go vet ./cni-plugin/pkg/ipamplugin/...

      - name: Go tests (Windows native)
        id: windows_go
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          go test -v "-coverprofile=felix-windows.cov" ./libcalico-go/lib/winmtu ./felix/dataplane/windows/...
          go test -v "-coverprofile=dataplane.cov" ./cni-plugin/pkg/dataplane/windows/...
          go test -v ./cni-plugin/pkg/plugin/...
          go test -v "-coverprofile=ipam.cov" -run "TestCalculateAssignCounts|TestWindowsHostReserved" ./cni-plugin/pkg/ipamplugin/...
          go test -v -run TestIPv6Supported ./node/pkg/lifecycle/startup/...
          # Execute the actual pod HTTP probe with Windows PowerShell on both
          # supported hosts; no Kubernetes provisioning is needed for this bug.
          go test -v -timeout=30s hack/appmana/lab/network_probes_test.go

      - name: Diagnose native dataplane failure
        if: failure() && steps.windows_go.conclusion == 'failure'
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | ConvertTo-Json | Set-Content diagnostics/os.json
          Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors | ConvertTo-Json | Set-Content diagnostics/cpu.json
          go env GOVERSION GOOS GOARCH GOAMD64 CGO_ENABLED | Set-Content diagnostics/go-env.txt
          git rev-parse HEAD | Set-Content diagnostics/source-commit.txt
          go test -c -cover -o diagnostics/windataplane.test.exe ./felix/dataplane/windows
          $env:GOTRACEBACK = "system"
          & ./diagnostics/windataplane.test.exe '-test.run=^TestWindataplane$' '-test.count=100' '-test.v' '-test.timeout=5m' 2>&1 | Tee-Object -FilePath diagnostics/constructor.log

      - name: Preserve native failure diagnostics
        if: always() && steps.windows_go.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-failure-${{ matrix.os }}
          path: diagnostics/
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-go-coverage-${{ matrix.os }}
          path: |
            felix-windows.cov
            dataplane.cov
            ipam.cov

      - name: PowerShell Pester tests
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # Pin Pester 5: the suites use Pester 5 semantics (multiple BeforeEach was
          # tolerated, mock behavior differs); runner-installed "latest" jumped to
          # 6.0.0 on 2026-07-07 and broke discovery. Migrate deliberately.
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $config = New-PesterConfiguration
          $config.Run.Path = @(
              './confd/windows-packaging/tests/config-bgp.tests.ps1',
              './node/windows-packaging/tests/calico.tests.ps1'
          )
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @(
              './confd/windows-packaging/config-bgp.psm1',
              './node/windows-packaging/CalicoWindows/libs/calico/calico.psm1'
          )
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = './confd-coverage.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pester-coverage
          path: confd-coverage.xml

  build-linux-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_IMAGE_TAG: ${{ needs.metadata.outputs.image-tag }}
    needs:
      - metadata
      - test-linux-all
      - test-linux-appmana
      - test-native-lab-contracts
      - build-windows-adapter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Add upstream Calico remote
        run: |
          git remote add projectcalico https://github.com/projectcalico/calico.git
          git fetch --no-tags projectcalico release-v3.32

      - name: Build Linux node image
        run: |
          make -C node image ARCH="$BUILD_ARCH" NODE_IMAGE=node
          docker tag "node:latest-${BUILD_ARCH}" "${REGISTRY}/node:${BUILD_IMAGE_TAG}-linux-${BUILD_ARCH}"

      - name: Build Linux CNI image
        run: |
          make -C cni-plugin image ARCH="$BUILD_ARCH" CNI_PLUGIN_IMAGE=cni
          docker run --rm --network none --entrypoint /opt/cni/bin/bandwidth \
            -e CNI_COMMAND=VERSION "cni:latest-${BUILD_ARCH}"
          docker tag "cni:latest-${BUILD_ARCH}" "${REGISTRY}/cni:${BUILD_IMAGE_TAG}-linux-${BUILD_ARCH}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Linux node image
        if: github.event_name != 'pull_request'
        run: docker push "${REGISTRY}/node:${BUILD_IMAGE_TAG}-linux-${BUILD_ARCH}"

      - name: Push Linux CNI image
        if: github.event_name != 'pull_request'
        run: |
          docker push "${REGISTRY}/cni:${BUILD_IMAGE_TAG}-linux-${BUILD_ARCH}"


  build-windows-image:
    runs-on: windows-2022
    # Windows packaging has no Linux build inputs. Build its revision-pinned
    # candidate after native tests while Linux qualification proceeds; the
    # final multi-platform publication below still requires every gate.
    needs:
      - metadata
      - test-linux-appmana
      - test-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Start Docker daemon
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Service docker -ErrorAction SilentlyContinue
          $retries = 10
          while ($retries -gt 0) {
            try { docker info | Out-Null; break } catch { Start-Sleep 3; $retries-- }
          }
          docker info

      - name: Build calico-node.exe
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $version = "${{ needs.metadata.outputs.image-tag }}"
          $revision = git rev-parse HEAD
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          New-Item -ItemType Directory -Force -Path node/dist/bin | Out-Null
          go build -o node/dist/bin/calico-node.exe -buildvcs=false `
            -ldflags "-X github.com/projectcalico/calico/pkg/buildinfo.Version=$version -X github.com/projectcalico/calico/pkg/buildinfo.GitRevision=$revision -X github.com/projectcalico/calico/pkg/buildinfo.BuildDate=$buildDate" `
            ./node/cmd/calico-node/main.go

          $binaryText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("node\dist\bin\calico-node.exe"))
          if (-not $binaryText.Contains($version)) {
            throw "calico-node.exe binary does not include $version"
          }
          if (-not $binaryText.Contains($revision)) {
            throw "calico-node.exe binary does not include $revision"
          }

      - name: Build Windows CNI binaries
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o node/dist/bin/calico.exe -buildvcs=false ./cni-plugin/cmd/calico/
          go build -o node/dist/bin/hns-ipv6-injector.exe -buildvcs=false ./cni-plugin/cmd/hns-ipv6-injector/
          Copy-Item node/dist/bin/calico.exe node/dist/bin/calico-ipam.exe

      - name: Build HNS IPv6 hook DLL
        shell: msys2 {0}
        run: |
          gcc -O2 -Wall -shared \
            -o node/dist/bin/hns-ipv6-hook.dll \
            cni-plugin/cmd/hns-ipv6-hook/hook.c \
            -lws2_32 -liphlpapi -static-libgcc

      - name: Prepare Windows packaging
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item confd/windows-packaging/config-bgp.ps1 node/windows-packaging/CalicoWindows/confd/config-bgp.ps1
          Copy-Item confd/windows-packaging/config-bgp.psm1 node/windows-packaging/CalicoWindows/confd/config-bgp.psm1
          Copy-Item confd/windows-packaging/conf.d/blocks.toml node/windows-packaging/CalicoWindows/confd/conf.d/blocks.toml
          Copy-Item confd/windows-packaging/conf.d/peerings.toml node/windows-packaging/CalicoWindows/confd/conf.d/peerings.toml
          Copy-Item confd/windows-packaging/templates/blocks.ps1.template node/windows-packaging/CalicoWindows/confd/templates/blocks.ps1.template
          Copy-Item confd/windows-packaging/templates/peerings.ps1.template node/windows-packaging/CalicoWindows/confd/templates/peerings.ps1.template

          New-Item -ItemType Directory -Force -Path node/windows-packaging/CalicoWindows/libs/hns | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/SDN/0d7593e5c8d4c2347079a7a6dbd9eb034ae19a44/Kubernetes/windows/hns.psm1" `
            -OutFile node/windows-packaging/CalicoWindows/libs/hns/hns.psm1

          Invoke-WebRequest -Uri "https://storage.googleapis.com/public-calico-third-party-deps/nssm/nssm-2.24-103-gdee49fc.zip" `
            -OutFile node/windows-packaging/nssm.zip
          Expand-Archive -Path node/windows-packaging/nssm.zip -DestinationPath node/windows-packaging/nssm-tmp
          Copy-Item node/windows-packaging/nssm-tmp/nssm-2.24-103-gdee49fc/win64/nssm.exe node/windows-packaging/nssm.exe
          Remove-Item -Recurse node/windows-packaging/nssm-tmp, node/windows-packaging/nssm.zip
          Copy-Item LICENSE.md node/dist/LICENSE

      - name: Build Windows node image
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cd node
          docker build `
            --no-cache `
            --isolation=process `
            --build-arg GIT_VERSION="${{ needs.metadata.outputs.image-tag }}" `
            --build-arg WINDOWS_VERSION=ltsc2022 `
            -t "${{ needs.metadata.outputs.windows-image }}" `
            -f Dockerfile-windows.local .

      - name: Build Windows Calico CNI installer image
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          New-Item -ItemType Directory -Force -Path cni-plugin/bin/windows | Out-Null
          go build -o cni-plugin/bin/windows/install.exe -buildvcs=false ./cni-plugin/cmd/install/
          Copy-Item node/dist/bin/calico.exe cni-plugin/bin/windows/calico.exe
          Copy-Item node/dist/bin/calico-ipam.exe cni-plugin/bin/windows/calico-ipam.exe
          Copy-Item node/dist/bin/hns-ipv6-injector.exe cni-plugin/bin/windows/hns-ipv6-injector.exe
          Copy-Item node/dist/bin/hns-ipv6-hook.dll cni-plugin/bin/windows/hns-ipv6-hook.dll
          Copy-Item LICENSE.md cni-plugin/bin/LICENSE
          docker build --isolation=process `
            --build-arg GIT_VERSION="${{ needs.metadata.outputs.image-tag }}" `
            --build-arg WINDOWS_VERSION=ltsc2022 `
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" `
            --label org.opencontainers.image.revision="${{ github.sha }}" `
            -t "${{ needs.metadata.outputs.cni-windows-image }}" `
            -f cni-plugin/Dockerfile-windows cni-plugin

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Windows node image
        if: github.event_name != 'pull_request'
        run: docker push "${{ needs.metadata.outputs.windows-image }}"

      - name: Push Windows CNI installer image
        if: github.event_name != 'pull_request'
        run: docker push "${{ needs.metadata.outputs.cni-windows-image }}"

  publish-manifest:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - metadata
      - build-linux-image
      - build-windows-image
      - test-linux-all
      - test-linux-appmana
      - test-native-lab-contracts
      - test-windows
      - build-windows-adapter
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-platform manifests
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.image-tag }}"
          # node and cni ship the same three platforms: Linux amd64/arm64 and
          # Windows Server 2022 (ltsc2022). Containerd on Server 2022 selects
          # by os.version, so the Windows entry carries the os.version of the
          # built image config rather than of the moving base tag, which may
          # have changed since the Windows builder pulled its layers.
          publish() {
            local image="${REGISTRY}/$1:${tag}"
            local win_config win_os_version
            win_config="$(docker buildx imagetools inspect "${image}-windows-ltsc2022" --format '{{json .Image}}')"
            win_os_version="$(jq -er 'select(.os == "windows" and .architecture == "amd64") | ."os.version" | select(type == "string" and startswith("10.0.20348."))' <<< "$win_config")"
            docker manifest create "$image" "${image}-linux-amd64" "${image}-linux-arm64" "${image}-windows-ltsc2022"
            docker manifest annotate --os linux --arch amd64 "$image" "${image}-linux-amd64"
            docker manifest annotate --os linux --arch arm64 "$image" "${image}-linux-arm64"
            docker manifest annotate --os windows --arch amd64 --os-version "$win_os_version" "$image" "${image}-windows-ltsc2022"
            docker manifest push --purge "$image"
            docker buildx imagetools inspect "$image"
            docker buildx imagetools inspect --raw "$image" | jq -e '
              [.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64", "windows/amd64"]' >/dev/null
          }
          publish node
          publish cni
