name: Build, test, and publish node image

on:
  push:
    branches:
      - appmana-v3.31.4
  pull_request:
    branches:
      - appmana-v3.31.4
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/appmana
  IMAGE_NAME: node
  IMAGE_TAG: v3.31.4-appmana.post.1

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image_tag }}
      linux-image: ${{ steps.meta.outputs.linux_image }}
      windows-image: ${{ steps.meta.outputs.windows_image }}
      manifest-image: ${{ steps.meta.outputs.manifest_image }}
    steps:
      - name: Compute image names
        id: meta
        run: |
          image_tag="${IMAGE_TAG}"
          manifest_image="${REGISTRY}/${IMAGE_NAME}:${image_tag}"
          linux_image="${REGISTRY}/${IMAGE_NAME}:${image_tag}-linux-amd64"
          windows_image="${REGISTRY}/${IMAGE_NAME}:${image_tag}-windows-ltsc2022"
          {
            echo "image_tag=${image_tag}"
            echo "manifest_image=${manifest_image}"
            echo "linux_image=${linux_image}"
            echo "windows_image=${windows_image}"
          } >> "$GITHUB_OUTPUT"
          echo "Manifest image: ${manifest_image}"

  test-linux-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - api
          - app-policy
          - apiserver
          - calicoctl
          - confd
          - cni-plugin
          - felix
          - goldmane
          - guardian
          - hack
          - key-cert-provisioner
          - kube-controllers
          - lib
          - libcalico-go
          - node
          - pod2daemon
          - release
          - typha
          - whisker-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Add upstream Calico remote
        run: |
          git remote add projectcalico https://github.com/projectcalico/calico.git
          git fetch --no-tags projectcalico release-v3.31

      - name: Linux unit tests
        run: |
          if [ "${{ matrix.component }}" = "kube-controllers" ]; then
            make -C kube-controllers image
          fi
          make -C "${{ matrix.component }}" ut

  test-linux-appmana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Add upstream Calico remote
        run: |
          git remote add projectcalico https://github.com/projectcalico/calico.git
          git fetch --no-tags projectcalico release-v3.31

      - name: AppMana targeted Go tests
        run: |
          go test ./felix/dataplane/windows/...
          go test ./confd/pkg/backends/calico/...
          go test ./cni-plugin/pkg/dataplane/windows/...
          go test ./cni-plugin/pkg/ipamplugin/...
          go test ./cni-plugin/pkg/plugin/...
          go test -run TestGetKubeconfigPath ./node/pkg/cni

      - name: PowerShell Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          $config = New-PesterConfiguration
          $config.Run.Path = @(
              './confd/windows-packaging/tests/config-bgp.tests.ps1',
              './node/windows-packaging/tests/calico.tests.ps1'
          )
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @(
              './confd/windows-packaging/config-bgp.psm1',
              './node/windows-packaging/CalicoWindows/libs/calico/calico.psm1'
          )
          Invoke-Pester -Configuration $config

  test-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: |
          go vet ./cni-plugin/pkg/dataplane/windows/...
          go vet ./cni-plugin/pkg/ipamplugin/...

      - name: Go tests (Windows native)
        run: |
          go test -v -coverprofile=dataplane.cov ./cni-plugin/pkg/dataplane/windows/...
          go test -v -coverprofile=ipam.cov -run "TestCalculateAssignCounts|TestWindowsHostReserved" ./cni-plugin/pkg/ipamplugin/...
          go test -v -run TestIPv6Supported ./node/pkg/lifecycle/startup/...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-go-coverage
          path: |
            dataplane.cov
            ipam.cov

      - name: PowerShell Pester tests
        run: |
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          $config = New-PesterConfiguration
          $config.Run.Path = @(
              './confd/windows-packaging/tests/config-bgp.tests.ps1',
              './node/windows-packaging/tests/calico.tests.ps1'
          )
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @(
              './confd/windows-packaging/config-bgp.psm1',
              './node/windows-packaging/CalicoWindows/libs/calico/calico.psm1'
          )
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = './confd-coverage.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pester-coverage
          path: confd-coverage.xml

  build-linux-image:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - test-linux-all
      - test-linux-appmana
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Add upstream Calico remote
        run: |
          git remote add projectcalico https://github.com/projectcalico/calico.git
          git fetch --no-tags projectcalico release-v3.31

      - name: Build Linux node image
        run: |
          make -C node image ARCH=amd64 NODE_IMAGE=node
          docker tag node:latest-amd64 "${{ needs.metadata.outputs.linux-image }}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Linux node image
        if: github.event_name == 'push'
        run: docker push "${{ needs.metadata.outputs.linux-image }}"

  build-windows-image:
    runs-on: windows-2022
    needs:
      - metadata
      - test-linux-all
      - test-linux-appmana
      - test-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Start Docker daemon
        run: |
          Start-Service docker -ErrorAction SilentlyContinue
          $retries = 10
          while ($retries -gt 0) {
            try { docker info | Out-Null; break } catch { Start-Sleep 3; $retries-- }
          }
          docker info

      - name: Build calico-node.exe
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $version = "${{ needs.metadata.outputs.image-tag }}"
          $revision = git rev-parse HEAD
          New-Item -ItemType Directory -Force -Path node/dist/bin | Out-Null
          go build -o node/dist/bin/calico-node.exe -buildvcs=false `
            -ldflags "-X node/buildinfo.GitVersion=$version -X node/buildinfo.GitRevision=$revision" `
            ./node/cmd/calico-node/main.go

      - name: Build Windows CNI binaries
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o node/dist/bin/calico.exe -buildvcs=false ./cni-plugin/cmd/calico/
          go build -o node/dist/bin/hns-ipv6-injector.exe -buildvcs=false ./cni-plugin/cmd/hns-ipv6-injector/
          Copy-Item node/dist/bin/calico.exe node/dist/bin/calico-ipam.exe

      - name: Build HNS IPv6 hook DLL
        shell: msys2 {0}
        run: |
          gcc -O2 -Wall -shared \
            -o node/dist/bin/hns-ipv6-hook.dll \
            cni-plugin/cmd/hns-ipv6-hook/hook.c \
            -lws2_32 -liphlpapi -static-libgcc

      - name: Prepare Windows packaging
        run: |
          Copy-Item confd/windows-packaging/config-bgp.ps1 node/windows-packaging/CalicoWindows/confd/config-bgp.ps1
          Copy-Item confd/windows-packaging/config-bgp.psm1 node/windows-packaging/CalicoWindows/confd/config-bgp.psm1
          Copy-Item confd/windows-packaging/conf.d/blocks.toml node/windows-packaging/CalicoWindows/confd/conf.d/blocks.toml
          Copy-Item confd/windows-packaging/conf.d/peerings.toml node/windows-packaging/CalicoWindows/confd/conf.d/peerings.toml
          Copy-Item confd/windows-packaging/templates/blocks.ps1.template node/windows-packaging/CalicoWindows/confd/templates/blocks.ps1.template
          Copy-Item confd/windows-packaging/templates/peerings.ps1.template node/windows-packaging/CalicoWindows/confd/templates/peerings.ps1.template

          New-Item -ItemType Directory -Force -Path node/windows-packaging/CalicoWindows/libs/hns | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/microsoft/SDN/0d7593e5c8d4c2347079a7a6dbd9eb034ae19a44/Kubernetes/windows/hns.psm1" `
            -OutFile node/windows-packaging/CalicoWindows/libs/hns/hns.psm1

          Invoke-WebRequest -Uri "https://storage.googleapis.com/public-calico-third-party-deps/nssm/nssm-2.24-103-gdee49fc.zip" `
            -OutFile node/windows-packaging/nssm.zip
          Expand-Archive -Path node/windows-packaging/nssm.zip -DestinationPath node/windows-packaging/nssm-tmp
          Copy-Item node/windows-packaging/nssm-tmp/nssm-2.24-103-gdee49fc/win64/nssm.exe node/windows-packaging/nssm.exe
          Remove-Item -Recurse node/windows-packaging/nssm-tmp, node/windows-packaging/nssm.zip

      - name: Build Windows node image
        run: |
          cd node
          docker build `
            --isolation=process `
            --build-arg GIT_VERSION="${{ needs.metadata.outputs.image-tag }}" `
            --build-arg WINDOWS_VERSION=ltsc2022 `
            -t "${{ needs.metadata.outputs.windows-image }}" `
            -f Dockerfile-windows.local .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Windows node image
        if: github.event_name == 'push'
        run: docker push "${{ needs.metadata.outputs.windows-image }}"

  publish-manifest:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - metadata
      - build-linux-image
      - build-windows-image
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-platform manifest
        run: |
          set -euo pipefail
          manifest_image="${{ needs.metadata.outputs.manifest-image }}"
          linux_image="${{ needs.metadata.outputs.linux-image }}"
          windows_image="${{ needs.metadata.outputs.windows-image }}"
          win_os_version="$(
            docker manifest inspect mcr.microsoft.com/windows/nanoserver:ltsc2022 |
              jq -r '.manifests[] | select(.platform.os == "windows" and .platform.architecture == "amd64") | .platform."os.version"' |
              head -n 1
          )"

          docker manifest create "$manifest_image" "$linux_image" "$windows_image"
          docker manifest annotate --os linux --arch amd64 "$manifest_image" "$linux_image"
          docker manifest annotate --os windows --arch amd64 --os-version "$win_os_version" "$manifest_image" "$windows_image"
          docker manifest push --purge "$manifest_image"

          docker buildx imagetools inspect "$manifest_image"
